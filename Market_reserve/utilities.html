<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <title>ค่าน้ำไฟ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="main_menu.html">ตลาดนัด</a>
            <div class="navbar-nav">
                <a class="nav-link" href="main_menu.html">หน้าแรก</a>
                <a class="nav-link" href="stalls.html">แผงค้า</a>
                <a class="nav-link" href="leases.html">สัญญา</a>
                <a class="nav-link" href="fines.html">ค่าปรับ</a>
                <a class="nav-link active" href="utilities.html">ค่าน้ำไฟ</a>
                <a class="nav-link" href="merchants.html">ผู้ค้า</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="msg" class="alert d-none" role="alert"></div>

        <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
            <div class="d-flex gap-2">
                <input id="search_input" type="text" class="form-control w-auto" placeholder="ค้นหารหัสสัญญา แผง หรือผู้ค้า">
                <select id="type_filter" class="form-select w-auto">
                    <option value="">ทุกประเภท</option>
                    <option value="water">น้ำ</option>
                    <option value="electricity">ไฟฟ้า</option>
                </select>
            </div>
            <button type="button" class="btn btn-primary" id="add_util_btn">บันทึกค่าน้ำไฟ</button>
        </div>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>รหัส</th>
                    <th>สัญญา</th>
                    <th>ประเภท</th>
                    <th>หน่วยที่ใช้</th>
                    <th>ราคาต่อหน่วย</th>
                    <th>ยอดค่าใช้จ่าย (บาท)</th>
                    <th>วันที่บันทึก</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <p id="count_msg" class="text-muted small"></p>
        <p id="load_error" class="text-danger d-none">โหลดข้อมูลค่าน้ำไฟไม่สำเร็จ</p>
    </div>

    <div class="modal fade" id="util_modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">บันทึกค่าน้ำไฟ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modal_error" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label">สัญญา</label>
                        <input id="lease_filter" type="text" class="form-control mb-2" placeholder="พิมพ์ค้นหา เช่น รหัสแผง ชื่อผู้ค้า หรือวันที่">
                        <select id="ulease_sel" class="form-select"></select>
                        <div class="invalid-feedback">กรุณาเลือกสัญญา</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ประเภท</label>
                        <select id="type_sel" class="form-select">
                            <option value="">-- เลือก --</option>
                            <option value="water">น้ำ</option>
                            <option value="electricity">ไฟฟ้า</option>
                        </select>
                        <div class="invalid-feedback" id="type_feedback">กรุณาเลือกประเภท</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">หน่วยที่ใช้</label>
                        <input id="units_input" type="number" step="0.01" class="form-control">
                        <div class="invalid-feedback">หน่วยที่ใช้ต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป</div>
                    </div>
                    <p class="text-muted mb-0">ยอดโดยประมาณ: <span id="preview">-</span> บาท</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary" id="util_confirm_btn">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
                function esc(s) {
                    return String(s ?? '').replace(/[&<>"']/g,
                        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                }

                const MAX_ROWS = 100;   // รายการมีหลายร้อยแถว แสดงทีละไม่เกิน 100 แถว ใช้ช่องค้นหาช่วยหา

                // ===== ข้อมูล: โหลดจากฐานข้อมูลผ่าน Utilities.ashx =====
                let utilities = [];   // charge_id, lease_id, stall_code, merchant_name, utility_type, units_used, unit_rate, charge_amount, recorded_at
                let leases = [];      // lease_id, stall_code, merchant_name, market_date (เฉพาะสัญญาที่ยังใช้งาน)

                let type_th = { water: 'น้ำ', electricity: 'ไฟฟ้า' };
                // ราคาต่อหน่วยตัวอย่าง ใช้แสดง "ยอดโดยประมาณ" เท่านั้น
                // ของจริงฐานข้อมูล (sp_record_utility) เป็นคนกำหนดราคาเอง หน้าเว็บส่งแค่สัญญา ประเภท และหน่วยที่ใช้
                let unit_rates = { water: 18, electricity: 8 };

                // ===== อ้างอิง element =====
                let tbody = document.getElementById('tbody');
                let msg = document.getElementById('msg');
                let count_msg = document.getElementById('count_msg');
                let load_error = document.getElementById('load_error');
                let search_input = document.getElementById('search_input');
                let type_filter = document.getElementById('type_filter');
                let util_modal = new bootstrap.Modal(document.getElementById('util_modal'));
                let modal_error = document.getElementById('modal_error');
                let lease_filter = document.getElementById('lease_filter');
                let ulease_sel = document.getElementById('ulease_sel');
                let type_sel = document.getElementById('type_sel');
                let units_input = document.getElementById('units_input');
                let preview = document.getElementById('preview');
                let type_feedback = document.getElementById('type_feedback');
                let confirm_btn = document.getElementById('util_confirm_btn');

                function show_msg(type, text) {
                    msg.className = 'alert alert-' + type;
                    msg.textContent = text;
                }

                // ===== โหลดข้อมูลจากฐานข้อมูล =====
                function load_data() {
                    fetch('utilities.ashx')
                        .then(r => {
                            if (!r.ok) throw new Error('โหลดไม่สำเร็จ');
                            return r.json();
                        })
                        .then(d => {
                            utilities = d.utilities;
                            leases = d.leases;
                            load_error.classList.add('d-none');
                            urender();
                        })
                        .catch(() => load_error.classList.remove('d-none'));
                }

                // ===== ฟังก์ชันตัวช่วย =====
                function lease_text(u) {
                    return `${u.lease_id} – ${u.stall_code} – ${u.merchant_name}`;
                }

                function lease_option_text(l) {
                    return `${l.lease_id} – ${l.stall_code} – ${l.merchant_name} – ${l.market_date}`;
                }

                function ufill_select(sel, items, value_of, text_of) {
                    sel.innerHTML = '<option value="">-- เลือก --</option>';
                    items.forEach(i => {
                        let opt = document.createElement('option');
                        opt.value = value_of(i);
                        opt.textContent = text_of(i);
                        sel.appendChild(opt);
                    });
                    sel.classList.remove('is-invalid');
                }

                // เติมช่องเลือกสัญญา โดยกรองตามข้อความที่พิมพ์ (สัญญามีหลายร้อยรายการ)
                function fill_lease_options() {
                    let keyword = lease_filter.value.trim().toLowerCase();
                    let items = leases.filter(l => lease_option_text(l).toLowerCase().includes(keyword));
                    ufill_select(ulease_sel, items, l => l.lease_id, l => lease_option_text(l));
                }

                // ยอดโดยประมาณ = หน่วย × ราคาของประเภทที่เลือก
                function update_preview() {
                    if (type_sel.value === '' || units_input.value === '') {
                        preview.textContent = '-';
                        return;
                    }
                    preview.textContent = (Number(units_input.value) * unit_rates[type_sel.value]).toLocaleString();
                }

                // ===== วาดตาราง =====
                function urender() {
                    let keyword = search_input.value.trim().toLowerCase();
                    let type = type_filter.value;

                    let rows = utilities.filter(u =>
                        (type === '' || u.utility_type === type) &&
                        (lease_text(u).toLowerCase().includes(keyword)));

                    let shown = rows.slice(0, MAX_ROWS);
                    count_msg.textContent = rows.length > MAX_ROWS
                        ? `แสดง ${MAX_ROWS} จาก ${rows.length} รายการ (ใช้ช่องค้นหาเพื่อกรอง)`
                        : `ทั้งหมด ${rows.length} รายการ`;

                    tbody.innerHTML = '';
                    shown.forEach(u => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `<td>${u.charge_id}</td><td>${esc(lease_text(u))}</td><td>${type_th[u.utility_type]}</td><td>${u.units_used}</td><td>${u.unit_rate}</td><td>${Number(u.charge_amount).toLocaleString()}</td><td>${esc(u.recorded_at)}</td>`;
                        tbody.appendChild(tr);
                    });
                }

                search_input.addEventListener('input', urender);
                type_filter.addEventListener('change', urender);

                // ===== ปุ่มเปิดฟอร์ม =====
                document.getElementById('add_util_btn').onclick = function () {
                    lease_filter.value = '';
                    fill_lease_options();   // leases มาจากฐานข้อมูลเฉพาะสัญญาที่ยังใช้งานอยู่แล้ว
                    type_sel.value = '';
                    units_input.value = '';
                    type_sel.classList.remove('is-invalid');
                    units_input.classList.remove('is-invalid');
                    type_feedback.textContent = 'กรุณาเลือกประเภท';
                    modal_error.classList.add('d-none');
                    preview.textContent = '-';
                    util_modal.show();
                };

                lease_filter.addEventListener('input', fill_lease_options);
                units_input.addEventListener('input', update_preview);
                type_sel.addEventListener('change', update_preview);

                // ===== ปุ่มบันทึก =====
                confirm_btn.onclick = function () {
                    let ok = true;
                    modal_error.classList.add('d-none');

                    // 1) สัญญา
                    if (ulease_sel.value === '') { ulease_sel.classList.add('is-invalid'); ok = false; }
                    else ulease_sel.classList.remove('is-invalid');

                    // 2) ประเภท (ต้องเลือก และห้ามซ้ำกับรายการที่มีอยู่ของสัญญาเดียวกัน)
                    type_feedback.textContent = 'กรุณาเลือกประเภท';
                    if (type_sel.value === '') {
                        type_sel.classList.add('is-invalid'); ok = false;
                    } else if (ulease_sel.value !== '' &&
                        utilities.some(u => u.lease_id === Number(ulease_sel.value) && u.utility_type === type_sel.value)) {
                        type_feedback.textContent = 'สัญญานี้มีรายการค่านี้แล้ว';
                        type_sel.classList.add('is-invalid'); ok = false;
                    } else {
                        type_sel.classList.remove('is-invalid');
                    }

                    // 3) หน่วยที่ใช้ (ห้ามว่าง และต้อง >= 0 ; 0 ผ่านได้)
                    if (units_input.value === '' || Number(units_input.value) < 0) {
                        units_input.classList.add('is-invalid'); ok = false;
                    } else units_input.classList.remove('is-invalid');

                    if (!ok) return;

                    confirm_btn.disabled = true;

                    // ส่งให้ handler เรียก sp_record_utility (ฐานข้อมูลใส่ราคาต่อหน่วยและเวลาเอง)
                    fetch('utilities.ashx', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            lease_id: Number(ulease_sel.value),
                            utility_type: type_sel.value,
                            units_used: Number(units_input.value)
                        })
                    })
                        .then(r => r.json())
                        .catch(() => ({ ok: false, message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' }))
                        .then(res => {
                            confirm_btn.disabled = false;
                            if (res.ok) {
                                util_modal.hide();
                                show_msg('success', `บันทึกค่า${type_th[type_sel.value]}เรียบร้อย (รหัส ${res.charge_id})`);
                                load_data();
                                return;
                            }
                            modal_error.textContent = res.message;
                            modal_error.classList.remove('d-none');
                        });
                };

                load_data();
    </script>
</body>
</html>
