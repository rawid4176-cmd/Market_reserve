<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <title>สัญญา</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!---แถบเลือเมนู-->
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="main_menu.html">ตลาดนัด</a>
            <div class="navbar-nav">
                <a class="nav-link " href="main_menu.html">หน้าแรก</a>
                <a class="nav-link " href="stalls.html">แผงค้า</a>
                <a class="nav-link active" href="leases.html">สัญญา</a>
                <a class="nav-link" href="fines.html">ค่าปรับ</a>
                <a class="nav-link" href="utilities.html">ค่าน้ำไฟ</a>
                <a class="nav-link" href="merchants.html">ผู้ค้า</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="msg" class="alert d-none" role="alert"></div>

        <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
            <input id="search_input" type="text" class="form-control w-auto" placeholder="ค้นหารหัสสัญญา แผง ผู้ค้า หรือวันที่">
            <select id="status_filter" class="form-select w-auto">
                <option value="">ทุกสถานะ</option>
                <option value="rented">ใช้งาน</option>
                <option value="cancelled">ยกเลิก</option>
            </select>
        </div>

        <table class="table table-hover ">
            <thead>
                <tr>
                    <th>รหัสสัญญา</th>
                    <th>แผง</th>
                    <th>พ่อค้า</th>
                    <th>วันตลาด</th>
                    <th>ค่าเช่า</th>
                    <th>มัดจำ</th>
                    <th>พนักงานที่ทำสัญญา</th>
                    <th>สถานะ</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        </table>
        <p id="count_msg" class="text-muted small"></p>
        <p id="load_error" class="text-danger d-none">โหลดข้อมูลสัญญาไม่สำเร็จ</p>

        <!--- โมเดลยกเลิกสัญญา-->
        <div class="modal fade" id="cancel_modal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">ยกเลิกสัญญา <span id="cancel_id"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="modal_error" class="alert alert-danger d-none"></div>
                        <p class="mb-1">แผง: <span id="cancel_stall"></span></p>
                        <p class="fw-bold">คืนเงินมัดจำ: <span id="cancel_refund"></span> บาท</p>
                        <div class="mb-3">
                            <label class="form-label">พนักงานผู้ทำรายการ</label>
                            <select id="cancel_staff_sel" class="form-select"></select>
                            <div class="invalid-feedback">กรุณาเลือกพนักงาน</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ไม่ยกเลิก</button>
                        <button type="button" class="btn btn-danger" id="cancel_confirm_btn">ยืนยันยกเลิก</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
                function esc(s) {
                    return String(s ?? '').replace(/[&<>"']/g,
                        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                }

                const MAX_ROWS = 100;   // สัญญามีหลายร้อยรายการ แสดงทีละไม่เกิน 100 แถว ใช้ช่องค้นหาช่วยหา

                // ===== ข้อมูล: โหลดจากฐานข้อมูลผ่าน Leases.ashx =====
                let leases = [];   // lease_id, stall_code, merchant_name, market_date, rent_price, deposit_amount, staff_name, status
                let staff = [];    // staff_id, staff_name

                // ค่าในฐานข้อมูลเป็นภาษาอังกฤษ ป้ายที่แสดงเป็นภาษาไทย
                let status_th = { rented: 'ใช้งาน', cancelled: 'ยกเลิก' };
                let lbadge_class = { rented: 'bg-success', cancelled: 'bg-secondary' };

                // ===== อ้างอิง element =====
                let ltbody = document.getElementById('tbody');
                let msg = document.getElementById('msg');
                let count_msg = document.getElementById('count_msg');
                let load_error = document.getElementById('load_error');
                let search_input = document.getElementById('search_input');
                let status_filter = document.getElementById('status_filter');
                let cancel_modal = new bootstrap.Modal(document.getElementById('cancel_modal'));
                let cancel_staff_sel = document.getElementById('cancel_staff_sel');
                let modal_error = document.getElementById('modal_error');
                let confirm_btn = document.getElementById('cancel_confirm_btn');
                let current_lease = null;

                function show_msg(type, text) {
                    msg.className = 'alert alert-' + type;
                    msg.textContent = text;
                }

                function lfill_select(sel, items, value_of, text_of) {
                    sel.innerHTML = '<option value="">-- เลือก --</option>';
                    items.forEach(i => {
                        let opt = document.createElement('option');
                        opt.value = value_of(i);
                        opt.textContent = text_of(i);
                        sel.appendChild(opt);
                    });
                    sel.classList.remove('is-invalid');
                }

                // ===== โหลดข้อมูลจากฐานข้อมูล =====
                function load_data() {
                    fetch('leases.ashx')
                        .then(r => {
                            if (!r.ok) throw new Error('โหลดไม่สำเร็จ');
                            return r.json();
                        })
                        .then(d => {
                            leases = d.leases;
                            staff = d.staff;
                            load_error.classList.add('d-none');
                            lrender();
                        })
                        .catch(() => load_error.classList.remove('d-none'));
                }

                // ===== วาดตาราง =====
                function lrender() {
                    let keyword = search_input.value.trim().toLowerCase();
                    let status = status_filter.value;

                    let rows = leases.filter(l =>
                        (status === '' || l.status === status) &&
                        (`${l.lease_id} ${l.stall_code} ${l.merchant_name} ${l.market_date}`.toLowerCase().includes(keyword)));

                    let shown = rows.slice(0, MAX_ROWS);
                    count_msg.textContent = rows.length > MAX_ROWS
                        ? `แสดง ${MAX_ROWS} จาก ${rows.length} รายการ (ใช้ช่องค้นหาเพื่อกรอง)`
                        : `ทั้งหมด ${rows.length} รายการ`;

                    ltbody.innerHTML = '';
                    shown.forEach(lease => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `<td>${lease.lease_id}</td><td>${esc(lease.stall_code)}</td><td>${esc(lease.merchant_name)}</td><td>${esc(lease.market_date)}</td><td>${lease.rent_price}</td><td>${lease.deposit_amount}</td><td>${esc(lease.staff_name)}</td>
                            <td><span class="badge ${lbadge_class[lease.status]}">${status_th[lease.status]}</span></td>`;

                        let td = document.createElement('td');
                        let btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn btn-sm btn-warning';
                        btn.textContent = 'ยกเลิกสัญญา';
                        if (lease.status === 'cancelled') btn.disabled = true;

                        btn.onclick = function () {
                            current_lease = lease;
                            document.getElementById('cancel_id').textContent = lease.lease_id;
                            document.getElementById('cancel_stall').textContent = lease.stall_code;
                            document.getElementById('cancel_refund').textContent = lease.deposit_amount;
                            lfill_select(cancel_staff_sel, staff, p => p.staff_id, p => p.staff_name);
                            modal_error.classList.add('d-none');
                            cancel_modal.show();
                        };

                        td.appendChild(btn);
                        tr.appendChild(td);
                        ltbody.appendChild(tr);
                    });
                }

                search_input.addEventListener('input', lrender);
                status_filter.addEventListener('change', lrender);

                // ===== ปุ่มยืนยันยกเลิก =====
                confirm_btn.onclick = function () {
                    if (cancel_staff_sel.value === '') {
                        cancel_staff_sel.classList.add('is-invalid');
                        return;
                    }
                    cancel_staff_sel.classList.remove('is-invalid');
                    modal_error.classList.add('d-none');
                    confirm_btn.disabled = true;

                    // ส่งให้ handler เรียก sp_cancel_lease (เปลี่ยนสถานะสัญญา + คืนมัดจำ ใน Transaction เดียว)
                    fetch('leases.ashx', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'cancel',
                            lease_id: current_lease.lease_id,
                            staff_id: Number(cancel_staff_sel.value)
                        })
                    })
                        .then(r => r.json())
                        .catch(() => ({ ok: false, message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' }))
                        .then(res => {
                            confirm_btn.disabled = false;
                            if (res.ok) {
                                cancel_modal.hide();
                                show_msg('success', `ยกเลิกสัญญา ${current_lease.lease_id} แล้ว คืนเงินมัดจำ ${Number(res.refund_amount).toLocaleString()} บาท`);
                                load_data();
                                return;
                            }
                            if (res.code === 50021) {
                                // สัญญาถูกยกเลิกไปแล้ว (ข้อมูลในหน้าเก่า) ปิดฟอร์มแล้วโหลดสถานะล่าสุด
                                cancel_modal.hide();
                                show_msg('danger', res.message);
                                load_data();
                                return;
                            }
                            modal_error.textContent = res.message;
                            modal_error.classList.remove('d-none');
                        });
                };

                load_data();
    </script>
</body>
</html>
