<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <title>ระบบตลาดนัด</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- ===== แถบเมนู (ก๊อปบล็อกนี้ไปวางบนสุดของ <body> ในทุกหน้า) ===== -->
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="main_menu.html">ตลาดนัด</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="main_menu.html">หน้าแรก</a>
                <a class="nav-link" href="stalls2.html">แผงค้า</a>
                <a class="nav-link" href="leases2.html">สัญญา</a>
                <a class="nav-link" href="fines2.html">ค่าปรับ</a>
                <a class="nav-link" href="utilities2.html">ค่าน้ำไฟ</a>
                <a class="nav-link" href="merchants2.html">ผู้ค้า</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h5 class="mb-3">ภาพรวมรายได้และการเช่าแผง</h5>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted">รายได้รวม (บาท)</div>
                        <div class="fs-3 fw-bold" id="sum_revenue"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted">อัตราการเช่ารวม</div>
                        <div class="fs-3 fw-bold" id="sum_occupancy"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted">แผงที่ถูกเช่า</div>
                        <div class="fs-3 fw-bold" id="sum_rented"></div>
                    </div>
                </div>
            </div>
        </div>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>โซน</th>
                    <th>แผงทั้งหมด</th>
                    <th>แผงที่ถูกเช่า</th>
                    <th>อัตราการเช่า</th>
                    <th>รายได้ค่าเช่า</th>
                    <th>รายได้ค่าน้ำไฟ</th>
                    <th>รายได้รวม</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
                // ===== ข้อมูลหลอก: หน้าตาเหมือนผลลัพธ์ของ vw_market_zone_revenue =====
                let zone_revenue = [
                    { zone_name: 'โซนอาหาร',    total_stalls: 3, rented_stalls: 2, rent_income: 600, utility_income: 180 },
                    { zone_name: 'โซนเสื้อผ้า', total_stalls: 1, rented_stalls: 0, rent_income: 0,   utility_income: 0 }
                ];

                let tbody = document.getElementById('tbody');

                // ตัวช่วย: รวมค่าของฟิลด์ทุกแถว
                function sum_of(field) {
                    return zone_revenue.reduce((total, z) => total + z[field], 0);
                }

                function render() {
                    tbody.innerHTML = '';
                    zone_revenue.forEach(z => {
                        let occupancy = z.total_stalls === 0 ? 0 : z.rented_stalls / z.total_stalls * 100;
                        let total = z.rent_income + z.utility_income;
                        let tr = document.createElement('tr');
                        tr.innerHTML = `<td>${z.zone_name}</td><td>${z.total_stalls}</td><td>${z.rented_stalls}</td>
                            <td>${occupancy.toFixed(1)}%</td>
                            <td>${z.rent_income.toLocaleString()}</td><td>${z.utility_income.toLocaleString()}</td>
                            <td>${total.toLocaleString()}</td>`;
                        tbody.appendChild(tr);
                    });

                    let all_stalls = sum_of('total_stalls');
                    let all_rented = sum_of('rented_stalls');
                    document.getElementById('sum_revenue').textContent = (sum_of('rent_income') + sum_of('utility_income')).toLocaleString();
                    document.getElementById('sum_occupancy').textContent = (all_stalls === 0 ? 0 : all_rented / all_stalls * 100).toFixed(1) + '%';
                    document.getElementById('sum_rented').textContent = all_rented + ' / ' + all_stalls;
                }

                render();
    </script>
</body>
</html>
