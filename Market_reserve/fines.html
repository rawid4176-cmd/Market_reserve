<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <title>ค่าปรับ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!---แถบเลือเมนู-->
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="main_menu.html">ตลาดนัด</a>
            <div class="navbar-nav">
                <a class="nav-link " href="main_menu.html">หน้าแรก</a>
                <a class="nav-link " href="stalls.html">แผงค้า</a>
                <a class="nav-link" href="leases.html">สัญญา</a>
                <a class="nav-link active" href="fines.html">ค่าปรับ</a>
                <a class="nav-link" href="utilities.html">ค่าน้ำไฟ</a>
                <a class="nav-link" href="merchants.html">ผู้ค้า</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="mb-0">รายการค่าปรับ</p>
            <button type="button" class="btn btn-danger" id="add_fine_btn">บันทึกค่าปรับ</button>
        </div>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>รหัสค่าปรับ</th>
                    <th>สัญญา</th>
                    <th>เหตุผล</th>
                    <th>จำนวนเงิน (บาท)</th>
                    <th>พนักงาน</th>
                    <th>วันที่</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <p id="load_error" class="text-danger d-none">โหลดข้อมูลค่าปรับไม่สำเร็จ</p>
    </div>

    <div class="modal fade" id="fine_modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">บันทึกค่าปรับ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">สัญญา</label>
                        <input id="lease_filter" type="text" class="form-control mb-2" placeholder="พิมพ์ค้นหา เช่น รหัสแผง ชื่อผู้ค้า หรือวันที่">
                        <select id="lease_sel" class="form-select"></select>
                        <div class="invalid-feedback">กรุณาเลือกสัญญา</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">เหตุผล</label>
                        <input id="reason_input" type="text" maxlength="200" class="form-control">
                        <div class="invalid-feedback">กรุณากรอกเหตุผล</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">จำนวนเงิน (บาท)</label>
                        <input id="amount_input" type="number" step="0.01" class="form-control">
                        <div class="invalid-feedback">จำนวนเงินต้องมากกว่า 0</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">พนักงานผู้บันทึก</label>
                        <select id="fine_staff_sel" class="form-select"></select>
                        <div class="invalid-feedback">กรุณาเลือกพนักงาน</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-danger" id="fine_confirm_btn">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
                                function esc(s) {
                                return String(s ?? '').replace(/[&<>"']/g,
                                c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                                }

                                // ===== ข้อมูล: เริ่มเป็นอาร์เรย์ว่าง แล้วโหลดจากฐานข้อมูลผ่าน Fines.ashx =====
                                let fines = [];    // fine_id, lease_id, stall_code, merchant_name, reason, amount, staff_name, fined_at
                                let leases = [];   // lease_id, stall_code, merchant_name, market_date (เฉพาะสัญญาที่ยังใช้งาน)
                                let staff = [];    // staff_id, staff_name

                                // ===== อ้างอิง element =====
                                let ftbody = document.getElementById('tbody');
                                let load_error = document.getElementById('load_error');
                                let fine_modal = new bootstrap.Modal(document.getElementById('fine_modal'));
                                let lease_filter = document.getElementById('lease_filter');
                                let lease_sel = document.getElementById('lease_sel');
                                let reason_input = document.getElementById('reason_input');
                                let amount_input = document.getElementById('amount_input');
                                let fine_staff_sel = document.getElementById('fine_staff_sel');

                                // ===== โหลดข้อมูลจากฐานข้อมูล =====
                                function load_data() {
                                    fetch('fines.ashx')
                                        .then(r => {
                                            if (!r.ok) throw new Error('โหลดไม่สำเร็จ');
                                            return r.json();
                                        })
                                        .then(d => {
                                            fines = d.fines;
                                            leases = d.leases;
                                            staff = d.staff;
                                            load_error.classList.add('d-none');
                                            frender();
                                        })
                                        .catch(() => load_error.classList.remove('d-none'));
                                }

                                // ===== ฟังก์ชันตัวช่วย =====
                                // ข้อความสัญญาในตาราง เช่น "1 – F01 – สมชาย"
                                function fine_lease_text(f) {
                                    return `${f.lease_id} – ${f.stall_code} – ${f.merchant_name}`;
                                }

                                // ข้อความสัญญาในช่องเลือก เพิ่มวันตลาดให้แยกสัญญาออกง่ายขึ้น
                                function lease_option_text(l) {
                                    return `${l.lease_id} – ${l.stall_code} – ${l.merchant_name} – ${l.market_date}`;
                                }

                                function ffill_select(sel, items, value_of, text_of) {
                                    sel.innerHTML = '<option value="">-- เลือก --</option>';
                                    items.forEach(i => {
                                        let opt = document.createElement('option');
                                        opt.value = value_of(i);
                                        opt.textContent = text_of(i);
                                        sel.appendChild(opt);
                                    });
                                    sel.classList.remove('is-invalid');
                                }

                                // เติมช่องเลือกสัญญา โดยกรองตามข้อความที่พิมพ์ (สัญญามีหลายร้อยรายการ)
                                function fill_lease_options() {
                                    let keyword = lease_filter.value.trim().toLowerCase();
                                    let items = leases.filter(l => lease_option_text(l).toLowerCase().includes(keyword));
                                    ffill_select(lease_sel, items, l => l.lease_id, l => lease_option_text(l));
                                }

                                // ===== วาดตาราง =====
                                function frender() {
                                    ftbody.innerHTML = '';
                                    fines.forEach(f => {
                                        let tr = document.createElement('tr');
                                        tr.innerHTML = `<td>${f.fine_id}</td><td>${esc(fine_lease_text(f))}</td><td>${esc(f.reason)}</td><td>${Number(f.amount).toLocaleString()}</td><td>${esc(f.staff_name)}</td><td>${esc(f.fined_at)}</td>`;
                                        ftbody.appendChild(tr);
                                    });
                                }

                                // ===== ปุ่มเปิดฟอร์ม =====
                                document.getElementById('add_fine_btn').onclick = function () {
                                    lease_filter.value = '';
                                    fill_lease_options();
                                    ffill_select(fine_staff_sel, staff, p => p.staff_id, p => p.staff_name);
                                    reason_input.value = '';
                                    amount_input.value = '';
                                    reason_input.classList.remove('is-invalid');
                                    amount_input.classList.remove('is-invalid');
                                    fine_modal.show();
                                };

                                lease_filter.addEventListener('input', fill_lease_options);

                                // ===== ปุ่มบันทึก =====
                                document.getElementById('fine_confirm_btn').onclick = function () {
                                    let ok = true;

                                    [lease_sel, fine_staff_sel].forEach(el => {
                                        if (el.value === '') { el.classList.add('is-invalid'); ok = false; }
                                        else el.classList.remove('is-invalid');
                                    });

                                    if (reason_input.value.trim() === '') { reason_input.classList.add('is-invalid'); ok = false; }
                                    else reason_input.classList.remove('is-invalid');

                                    if (Number(amount_input.value) <= 0) { amount_input.classList.add('is-invalid'); ok = false; }
                                    else amount_input.classList.remove('is-invalid');

                                    if (!ok) return;

                                    // ส่งไปให้ handler เขียนลงฐานข้อมูลจริง (fined_at ฐานข้อมูลใส่เวลาให้เอง)
                                    fetch('fines.ashx', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            lease_id: Number(lease_sel.value),
                                            staff_id: Number(fine_staff_sel.value),
                                            reason: reason_input.value.trim(),
                                            amount: Number(amount_input.value)
                                        })
                                    })
                                        .then(r => r.json())
                                        .catch(() => ({ ok: false, message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' }))
                                        .then(res => {
                                            if (!res.ok) {
                                                alert(res.message);
                                                return;
                                            }
                                            fine_modal.hide();
                                            load_data();   // โหลดรายการใหม่จากฐานข้อมูล
                                        });
                                };

                                load_data();
    </script>
</body>
</html>
